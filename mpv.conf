### general ###
keep-open=yes
osd-font-size=32
alang=jpn
slang=eng

### SET THIS TO YOUR OWN DIRECTORY ###
screenshot-directory="\\mortis\media\screenshots"
### SET THIS TO YOUR OWN DIRECTORY ###

screenshot-format=webp
screenshot-webp-quality=95
screenshot-webp-compression=3
sub-ass-override=no
sub-margin-y=35



###subtitltes override###
sub-font='Gandhi Sans'
sub-color='#EBEBEB'
sub-font-size=48
sub-shadow-color='#000000'
sub-bold=yes
sub-border-size=3
sub-blur=0.25
sub-pos=100
sub-shadow-offset=1.5

### Deband ###
#deband=no
#deband-iterations=16
#deband-threshold=32
#deband-range=64
#deband-grain=12

### Other ###

### (SET THIS TO YOUR OWN MPV) ###
script-opts=ytdl_hook-ytdl_path=C:\cli\bin\yt-dlp.exe 
### (SET THIS TO YOUR OWN MPV) ###


